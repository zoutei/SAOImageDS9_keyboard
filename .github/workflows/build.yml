name: Build and Package SAOImageDS9

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y automake autoconf libx11-dev zlib1g-dev libxml2-dev libxslt1-dev libxft-dev zip tcl8.6-dev tk8.6-dev

      - name: Configure Build
        run: |
          ./unix/configure

      - name: Build
        run: |
          make -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist
          make dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ds9-linux
          path: |
            dist/*.tar.gz

  build-macos:
    name: Build on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Build
        run: |
          ./macos/configure

      - name: Build
        run: |
          make -j$(sysctl -n hw.ncpu)

      - name: Package
        run: |
          mkdir -p dist
          make dist

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ds9-macos
          path: |
            dist/*.dmg
