name: Build and Package SAOImageDS9

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # --------------------------------------------------------
  # macOS Apple Silicon Build & Package
  # --------------------------------------------------------
  build-macos-arm64:
    name: Build macOS Apple Silicon (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools
        run: brew install autoconf automake libtool

      - name: Configure Build
        run: |
          # Force linking against Xcode SDK system libraries to ensure portability
          ./macos/configure XML2CONFIG=/usr/bin/xml2-config XSLTCONFIG=/usr/bin/xslt-config

      - name: Build
        run: make -j$(sysctl -n hw.ncpu)

      - name: Embed XPA Binaries in App Bundle
        run: |
          # Create resources bin folder inside the app bundle
          mkdir -p bin/SAOImageDS9.app/Contents/Resources/bin
          # Copy XPA command-line tools
          cp -p bin/xpaaccess bin/xpaget bin/xpainfo bin/xpamb bin/xpans bin/xpaset \
                bin/SAOImageDS9.app/Contents/Resources/bin/

      - name: Package DMG
        run: |
          mkdir -p dist/SAOImageDS9
          cp -rp bin/SAOImageDS9.app dist/SAOImageDS9/
          ln -s /Applications dist/SAOImageDS9/.
          cp -r ds9/macos/README dist/SAOImageDS9/.
          hdiutil create -srcfolder dist/SAOImageDS9 -volname "SAOImageDS9" dist/SAOImageDS9.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ds9-macos
          path: dist/SAOImageDS9.dmg

  # --------------------------------------------------------
  # Create GitHub Release & Upload Assets
  # --------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-macos-arm64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: ds9-macos
          path: ./dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
