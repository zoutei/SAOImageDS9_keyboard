name: Build and Package SAOImageDS9

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Cygwin
        uses: egor-tensin/setup-cygwin@v4
        with:
          packages: >-
            make autoconf automake git zip unzip patch pkg-config dos2unix
            mingw64-x86_64-gcc-core mingw64-x86_64-gcc-g++
            mingw64-x86_64-binutils
            mingw64-x86_64-libxml2 mingw64-x86_64-libxslt
            mingw64-x86_64-zlib

      - name: Configure and Build
        shell: C:\tools\cygwin\bin\bash.exe --login -o errexit -o pipefail -o igncr {0}
        run: |
          export PATH="/usr/local/bin:/usr/bin:/bin"
          export CC="x86_64-w64-mingw32-gcc"
          export CXX="x86_64-w64-mingw32-g++"
          export AR="x86_64-w64-mingw32-ar"
          export RANLIB="x86_64-w64-mingw32-ranlib"
          export WINDRES="x86_64-w64-mingw32-windres"
          cd "$(cygpath "$GITHUB_WORKSPACE")"
          git config --global --add safe.directory '*'
          find . -type f \( -name "configure" -o -name "*.sh" -o -name "install-sh" -o -name "config.sub" -o -name "config.guess" \) -exec chmod +wx {} +
          find . -type f \( -name "configure" -o -name "*.sh" -o -name "install-sh" -o -name "config.sub" -o -name "config.guess" \) -exec dos2unix -f {} +
          ./win/configure --host=x86_64-w64-mingw32
          make -j$(nproc)

      - name: Package Windows Version
        shell: C:\tools\cygwin\bin\bash.exe --login -o errexit -o pipefail -o igncr {0}
        run: |
          export PATH="/usr/local/bin:/usr/bin:/bin"
          cd "$(cygpath "$GITHUB_WORKSPACE")"
          mkdir -p dist
          cd bin
          zip -r ../dist/SAOImageDS9-win64.zip SAOImageDS9

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ds9-windows
          path: |
            dist/*.zip
