# SAOImageDS9 Custom Keyboard Shortcuts Configuration File
# Format: KeySequence = Action [arguments...]
#
# Comments start with '#' or ';'.
# Key sequences are matched case-sensitively. If no exact match or prefix is found
# for the pressed key, it falls back to case-insensitive matching (checking lowercase, then uppercase).
# Action names are case-sensitive.
# Multi-key sequences (e.g., C1, C5, C2, C9) are supported.
#
# Config Options:
# - timeout = <ms>         : The delay in milliseconds before executing a shortcut
#                            that is also the prefix of a longer shortcut (default is 500).
#
# Supported Predefined Actions:
# - lock_scale_limits      : Toggles the Scale and Limits lock across frames
# - lock_frame <type>      : Locks/Aligns frames using: none, image, wcs, physical, etc.
# - scale <mode>           : Sets the scale limits mode (e.g., 90, zscale, minmax, etc.)
# - range <min> <max>      : Sets the manual user limits range (e.g., -10 10)
# - delete_frame           : Deletes the current active frame
# - display <mode>         : Sets display layout: single, blink, tile, fade
# - mode <type>            : Sets cursor mode: none, region, pan, crosshair, examine, etc.
# - tcl <command>          : Runs an arbitrary Tcl command
# - any other word         : Falls back to executing as a direct Tcl command/procedure

# Prefix timeout delay in milliseconds
timeout = 500

# 'L' toggles the limit and scale lock
L = lock_scale_limits

# 'I' toggles locking the frame with Image
I = lock_frame image

# 'W' toggles locking the frame with WCS
W = lock_frame wcs

# 'C9' sets scale mode/percentage to 90%
C9 = scale 90

# 'C1' sets the limits range from -10 to 10
C1 = range -10 10

# 'C5' sets the limits range from -5 to 5
C5 = range -5 5

# 'C2' sets the limits range from -20 to 20
C2 = range -20 20

# 'D' deletes the current frame
D = delete_frame

# 'B' switches the display to Blink mode
B = display blink

# 'S' switches the display to Single mode
S = display single

# 'T' switches the display to Tile mode
T = display tile

# 'P' switches the interaction mode to Pan
P = mode pan

# 'r' switches the interaction mode to Region (Pointer)
r = mode region

# 'R' (Shift + R) opens a region file
R = MarkerLoad

# 'N' switches the interaction mode to None
N = mode none
