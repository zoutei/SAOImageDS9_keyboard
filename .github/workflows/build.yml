name: Build and Package SAOImageDS9

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Cygwin
        uses: egor-tensin/setup-cygwin@v4
        with:
          packages: >-
            make autoconf automake git zip unzip patch pkg-config dos2unix
            mingw64-x86_64-gcc-core mingw64-x86_64-gcc-g++
            mingw64-x86_64-libxml2 mingw64-x86_64-libxslt
            mingw64-x86_64-zlib

      - name: Configure and Build
        shell: C:\tools\cygwin\bin\bash.exe --login -o errexit -o pipefail -o igncr {0}
        run: |
          cd "$(cygpath "$GITHUB_WORKSPACE")"
          git config --global --add safe.directory '*'
          chmod -R +w .
          find . -type f -name "configure" -exec dos2unix {} +
          find . -type f -name "*.sh" -exec dos2unix {} +
          chmod +x ./win/configure
          ./win/configure
          make -j$(nproc)

      - name: Package Windows Version
        shell: C:\tools\cygwin\bin\bash.exe --login -o errexit -o pipefail -o igncr {0}
        run: |
          cd "$(cygpath "$GITHUB_WORKSPACE")"
          mkdir -p dist
          cd bin
          zip -r ../dist/SAOImageDS9-win64.zip SAOImageDS9

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ds9-windows
          path: |
            dist/*.zip
